<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="t d">
<title id="t">Core loop at three scales: walker-2d-dodge-the-creeps</title>
<desc id="d">Micro: read, steer, clear. Meso: one run from Get Ready to Game Over. Macro: restart for score. Dashed: difficulty ramp and persistence not in code. M-01..M-06.</desc>
<rect width="1400" height="620" fill="#faf9f5"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#25354a"/></marker></defs>
<g font-family="Helvetica, Arial, sans-serif" fill="#25354a">
<text x="40" y="50" font-size="30" font-weight="700">Core loop · three scales</text>
<text x="40" y="78" font-size="15" fill="#5b6b7c">solid = observed · dashed = proposed (Q-05, Q-06)</text>
<g stroke="#25354a" stroke-width="2.5" fill="#fffdf7">
<rect x="40" y="120" width="420" height="380" rx="12"/><rect x="490" y="120" width="420" height="380" rx="12"/><rect x="940" y="120" width="420" height="380" rx="12"/>
</g>
<g font-size="22" font-weight="700"><text x="64" y="160">MICRO · 0.5–2 s</text><text x="514" y="160">MESO · one run</text><text x="964" y="160">MACRO · session</text></g>
<g font-size="17">
<text x="64" y="210">1 read incoming creeps</text><text x="64" y="245">2 steer 8-way, 400 px/s (M-01)</text><text x="64" y="280">3 stay clear, or touch → death (M-04)</text><text x="64" y="315">4 score +1 per ScoreTimer (M-05)</text>
<text x="514" y="210">Start → "Get Ready"</text><text x="514" y="245">2 s → spawns every 0.5 s (M-03)</text><text x="514" y="280">creeps 150–250 px/s, random path</text><text x="514" y="315">one hit → Game Over</text>
<text x="964" y="210">Start button returns (M-06)</text><text x="964" y="245">new_game clears mobs, score 0</text><text x="964" y="280">try for a higher score</text>
</g>
<g stroke="#25354a" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M460 300 H485"/><path d="M910 300 H935"/></g>
<rect x="514" y="370" width="370" height="90" rx="8" fill="none" stroke="#d24e42" stroke-width="2.5" stroke-dasharray="10 7"/>
<text x="530" y="405" font-size="15" fill="#d24e42">difficulty ramp: none in code (spawn</text><text x="530" y="428" font-size="15" fill="#d24e42">rate and speed constant) · Q-05</text>
<rect x="964" y="370" width="370" height="90" rx="8" fill="none" stroke="#d24e42" stroke-width="2.5" stroke-dasharray="10 7"/>
<text x="980" y="405" font-size="15" fill="#d24e42">persistent high score: no save</text><text x="980" y="428" font-size="15" fill="#d24e42">code exists · Q-06</text>
</g>
</svg>
